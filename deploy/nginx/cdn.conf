limit_req_zone $binary_remote_addr zone=cdn_per_ip:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=cdn_admin:1m rate=5r/m;

upstream cdn_backend {
    server 127.0.0.1:9876;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name 161-118-169-11.sslip.io;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name 161-118-169-11.sslip.io;

    ssl_certificate /etc/letsencrypt/live/161-118-169-11.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/161-118-169-11.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://cdn_backend;
    }

    location ~ ^/(buckets|reset-cache) {
        limit_req zone=cdn_admin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://cdn_backend;
    }

    location / {
        limit_req zone=cdn_per_ip burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://cdn_backend;
    }
}
