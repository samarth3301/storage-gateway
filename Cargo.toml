[package]
name = "s3-cdn-network"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
aws-sdk-s3 = "1.0"
dotenvy = "0.15"
moka = { version = "0.12", features = ["future"] }
bytes = "1.0"
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.7", features = ["cors", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
mongodb = { version = "2.8", features = ["tokio-runtime"] }
futures = "0.3.32"
tokio-stream = "0.1"
aes-gcm = "0.11.1"
base64 = "0.23.1"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
